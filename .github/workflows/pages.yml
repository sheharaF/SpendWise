name: Refresh and publish offers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offer-finder-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Restore the latest successful bank snapshots
        uses: actions/cache/restore@v4
        with:
          path: dist/offers.json
          key: offers-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: offers-
      - run: npm run refresh
      - name: Keep snapshots available for the next refresh
        if: success()
        uses: actions/cache/save@v4
        with:
          path: dist/offers.json
          key: offers-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

